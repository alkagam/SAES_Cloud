<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Horarios</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; }
        .ipn-logo, .system-v, .section-title, .nav-item.active, .nav-item:hover, .user-dot, .cyber-table th { color: var(--neon-green) !important; border-color: var(--neon-green) !important; }
        .nav-item.active { background: rgba(0, 255, 136, 0.1) !important; box-shadow: inset 3px 0 0 var(--neon-green) !important; }
        .user-dot { background: var(--neon-green) !important; box-shadow: 0 0 8px var(--neon-green) !important; }
        .schedule-cell { background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.2); text-align: center; padding: 10px; font-size: 0.75rem; }
        .schedule-cell strong { color: white; display: block; margin-bottom: 5px; }
        .schedule-cell span { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info"><span class="esime-name">ESIME CU</span><span class="system-v">SAES_CLOUD_V.26</span></div>
            <button class="menu-toggle" onclick="document.querySelector('.sidebar-fixed').classList.toggle('active')">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">S. Morales</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ALUMNO REGULAR</span></div>
        </div>
        <a href="../esimecu.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_ENLACE</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Horario de Clases</h1>
                <p class="mono-sub">PERIODO_ACTUAL: 2024/2</p>
            </div>
        </header>

        <div class="table-responsive">
            <table class="cyber-table">
                <thead><tr><th>HORA</th><th>LUNES</th><th>MARTES</th><th>MIÉRCOLES</th><th>JUEVES</th><th>VIERNES</th></tr></thead>
                <tbody>
                    <tr>
                        <td>07:00 - 08:30</td>
                        <td></td>
                        <td class="schedule-cell"><strong>Cálculo Vectorial</strong><span>Edif. 1 - Salón 101</span></td>
                        <td></td>
                        <td class="schedule-cell"><strong>Cálculo Vectorial</strong><span>Edif. 1 - Salón 101</span></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>08:30 - 10:00</td>
                        <td class="schedule-cell"><strong>POO</strong><span>Lab. de Cómputo 3</span></td>
                        <td></td>
                        <td class="schedule-cell"><strong>POO</strong><span>Lab. de Cómputo 3</span></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="../js/sidebar-loader.js"></script>
</body>
</html>
