<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Seguridad</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; }
        .ipn-logo, .system-v, .section-title, .nav-item.active, .nav-item:hover, .user-dot, .widget-header, .mono-sub, .health-value, .status-bar-fill, .btn-outline-cyan, .badge.available { color: var(--neon-green) !important; border-color: var(--neon-green) !important; }
        .nav-item.active { background: rgba(0, 255, 136, 0.1) !important; box-shadow: inset 3px 0 0 var(--neon-green) !important; }
        .user-dot { background: var(--neon-green) !important; box-shadow: 0 0 8px var(--neon-green) !important; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--neon-green); margin-bottom: 8px; }
        .form-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; font-family: 'Inter'; }
        .form-control:focus { outline: none; border-color: var(--neon-green); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info"><span class="esime-name">ESIME CU</span><span class="system-v">SAES_CLOUD_V.26</span></div>
            <button class="menu-toggle" onclick="document.querySelector('.sidebar-fixed').classList.toggle('active')">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">S. Morales</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ALUMNO REGULAR</span></div>
        </div>
        <a href="../esimecu.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_ENLACE</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Gestión de Seguridad</h1>
                <p class="mono-sub">CAMBIO_DE_CONTRASEÑA // CREDENCIALES</p>
            </div>
            <div class="system-health" style="font-family: 'JetBrains Mono'; font-size: 0.7rem;">
                <span class="health-label" style="opacity:0.6;">NIVEL DE SEGURIDAD:</span>
                <span class="health-value">ALTO</span>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="widget-header">ACTUALIZAR CONTRASEÑA</div>
            <form>
                <div class="form-group">
                    <label>CONTRASEÑA ACTUAL</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>NUEVA CONTRASEÑA</label>
                    <input type="password" class="form-control" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="form-group">
                    <label>CONFIRMAR NUEVA CONTRASEÑA</label>
                    <input type="password" class="form-control" placeholder="Repite la contraseña">
                </div>
                <div style="text-align: right;">
                    <button class="btn-outline-cyan" style="width: auto; padding: 10px 30px;">ACTUALIZAR CREDENCIALES</button>
                </div>
            </form>
        </div>
    </main>
    <script src="../js/api-config.js"></script>
    <script src="../js/catalog-service.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.career-select').forEach(s => populateCareers(s));
        });
    </script>
</body>
</html>
