<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Datos Médicos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; }
        .ipn-logo, .system-v, .section-title, .nav-item.active, .nav-item:hover, .user-dot, .widget-header, .mono-sub, .health-value, .status-bar-fill, .btn-outline-cyan, .badge.available { color: var(--neon-green) !important; border-color: var(--neon-green) !important; }
        .nav-item.active { background: rgba(0, 255, 136, 0.1) !important; box-shadow: inset 3px 0 0 var(--neon-green) !important; }
        .user-dot { background: var(--neon-green) !important; box-shadow: 0 0 8px var(--neon-green) !important; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .form-group label { font-size: 0.7rem; color: var(--neon-green); opacity: 0.7; margin-bottom: 8px; display: block; }
        .form-group input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: white; }
        .form-group input:focus { outline: none; border-color: var(--neon-green); }
        .form-group input[readonly] { background: transparent; border-color: transparent; color: rgba(255,255,255,0.5); cursor: not-allowed; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info"><span class="esime-name">ESIME CU</span><span class="system-v">SAES_CLOUD_V.26</span></div>
            <button class="menu-toggle" onclick="document.querySelector('.sidebar-fixed').classList.toggle('active')">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">S. Morales</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ALUMNO REGULAR</span></div>
        </div>
        <a href="../esimecu.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_ENLACE</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Datos Médicos</h1>
                <p class="mono-sub">EXPEDIENTE_CLÍNICO // SEGURO_FACULTATIVO</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="widget-header">INFORMACIÓN DE SALUD</div>
            <form>
                <div class="form-grid">
                    <div class="form-group">
                        <label>NÚMERO DE SEGURO SOCIAL (NSS)</label>
                        <input type="text" value="1234-56-7890" readonly>
                    </div>
                    <div class="form-group">
                        <label>CLÍNICA DE ADSCRIPCIÓN</label>
                        <input type="text" value="UMF 163" readonly>
                    </div>
                    <div class="form-group">
                        <label>TIPO DE SANGRE</label>
                        <input type="text" value="O POSITIVO" readonly>
                    </div>
                    <div class="form-group">
                        <label>ALERGIAS REGISTRADAS</label>
                        <input type="text" value="PENICILINA" readonly>
                    </div>
                    <div class="form-group">
                        <label>CONTACTO DE EMERGENCIA</label>
                        <input type="text" value="MARÍA SÁNCHEZ (MADRE) - 55 9988 7766">
                    </div>
                </div>
                <div style="margin-top: 30px; text-align: right;">
                    <button type="button" class="btn-outline-cyan">ACTUALIZAR CONTACTO</button>
                </div>
            </form>
        </div>
    </main>
    <script src="../js/api-config.js"></script>
    <script src="../js/catalog-service.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.career-select').forEach(s => populateCareers(s));
        });
    </script>
</body>
</html>
