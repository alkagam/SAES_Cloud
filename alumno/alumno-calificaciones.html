<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Calificaciones</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- TEMA VERDE (Igual que el Dashboard) --- */
        :root { --neon-green: #00ff88; --glass-green: rgba(0, 255, 136, 0.05); }
        .ipn-logo { color: #fff !important; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .system-v { color: var(--neon-green) !important; }
        .section-title { color: var(--neon-green) !important; opacity: 0.7; }
        .nav-item.active { background: rgba(0, 255, 136, 0.1) !important; color: var(--neon-green) !important; box-shadow: inset 3px 0 0 var(--neon-green) !important; }
        .nav-item:hover { color: var(--neon-green) !important; }
        .user-dot { background: var(--neon-green) !important; box-shadow: 0 0 8px var(--neon-green) !important; }
        @media (max-width: 768px) { .sidebar-fixed { border-bottom: 1px solid rgba(0, 255, 136, 0.2); } }

        /* --- ESTILOS DE TABLA DE CALIFICACIONES --- */
        .cyber-table th { color: var(--neon-green); border-bottom: 1px solid rgba(0, 255, 136, 0.3); }
        .cyber-table td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .grade-pass { color: #00ff88; font-weight: bold; }
        .grade-fail { color: #ff0055; font-weight: bold; }
        .grade-pending { color: #666; font-style: italic; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>

    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info">
                <span class="esime-name">ESIME CU</span>
                <span class="system-v">SAES_CLOUD_V.26</span>
            </div>
            <button class="menu-toggle" onclick="document.querySelector('.sidebar-fixed').classList.toggle('active')">☰</button>
        </div>

        <nav class="nav-container">
            <!-- El menú se carga dinámicamente desde js/sidebar-loader.js -->
        </nav>

        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div style="display:flex; flex-direction:column;">
                <span class="user-name" style="font-weight:bold; color:white;">S. Morales</span>
                <span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ALUMNO REGULAR</span>
            </div>
        </div>
        <a href="../esimecu.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_ENLACE</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Kárdex Académico</h1>
                <p class="mono-sub" id="period-subtitle">PERIODO_ACTUAL: CARGANDO...</p>
            </div>
            <div class="system-health" style="font-family: 'JetBrains Mono'; font-size: 0.7rem;">
                <span class="health-label" style="opacity:0.6;">PROMEDIO SEMESTRE:</span>
                <span class="health-value">-.-</span>
            </div>
        </header>

        <div class="table-responsive">
            <table class="cyber-table">
                <thead>
                    <tr><th>MATERIA</th><th>P1</th><th>P2</th><th>P3</th><th>EXTRA</th><th>FINAL</th></tr>
                </thead>
                <tbody><!-- Las calificaciones se cargarán aquí dinámicamente --></tbody>
            </table>
        </div>
    </main>
    <script src="../js/api-config.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script src="../js/catalog-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.querySelector('.cyber-table tbody');
            const averageSpan = document.querySelector('.system-health .health-value');
            const periodSubtitle = document.getElementById('period-subtitle');

            const accessToken = sessionStorage.getItem('accessToken');
            const studentId = sessionStorage.getItem('studentId');

            const renderRow = (grade) => {
                const formatGrade = (g) => {
                    if (g === null || g === undefined) return '<td class="grade-pending">-</td>';
                    const val = parseFloat(g);
                    const cssClass = val < 6 ? 'grade-fail' : 'grade-pass';
                    return `<td class="${cssClass}">${val.toFixed(0)}</td>`;
                };

                const formatFinal = (g) => {
                    if (g === null || g === undefined) return '<td class="grade-pending">PEND</td>';
                    const val = parseFloat(g);
                    const cssClass = val < 6 ? 'grade-fail' : 'grade-pass';
                    return `<td class="${cssClass}">${val.toFixed(1)}</td>`;
                };

                return `
                    <tr>
                        <td>${grade.materia || 'N/A'}</td>
                        ${formatGrade(grade.parcial_1)}
                        ${formatGrade(grade.parcial_2)}
                        ${formatGrade(grade.parcial_3)}
                        <td>-</td> <!-- EXTRA no viene de la API -->
                        ${formatFinal(grade.definitiva)}
                    </tr>
                `;
            };

            if (!accessToken || !studentId) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: #ff0055;">Error de autenticación. Por favor, inicie sesión.</td></tr>';
                return;
            }

            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; opacity: 0.7;">Cargando calificaciones...</td></tr>';

            try {
                // 1. Obtener el periodo activo
                const periodResponse = await fetch(`${API_BASE_URL}/saes-cloud-api/api/periods/active`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (!periodResponse.ok) throw new Error('No se pudo obtener el periodo académico activo.');
                const activePeriod = await periodResponse.json();
                const periodId = activePeriod.id_periodo;
                if (periodSubtitle) {
                    periodSubtitle.textContent = `PERIODO_ACTUAL: ${activePeriod.clave}`;
                    // también mostrar carrera del alumno
                    try {
                        const meRes = await fetch(`${API_BASE_URL}/saes-cloud-api/api/users/me`, { headers:{ Authorization:`Bearer ${accessToken}` }});
                        if (meRes.ok) {
                            const me = await meRes.json();
                            if (me.id_alumno) {
                                const studRes = await fetch(`${API_BASE_URL}/saes-cloud-api/api/users/students/${me.id_alumno}`, { headers:{ Authorization:`Bearer ${accessToken}` }});
                                if (studRes.ok) {
                                    const stud = await studRes.json();
                                    if (stud.id_carrera) {
                                        const nombre = await getCareerName(stud.id_carrera);
                                        periodSubtitle.textContent += ` • ${nombre}`;
                                    }
                                }
                            }
                        }
                    } catch(e){console.warn('no se pudo cargar carrera', e);}
                }

                // 2. Obtener las calificaciones del alumno para ese periodo
                const gradesUrl = `${API_BASE_URL}/saes-cloud-api/api/grades/students/${studentId}?id_periodo=${periodId}`;
                const gradesResponse = await fetch(gradesUrl, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (!gradesResponse.ok) throw new Error('No se pudieron cargar las calificaciones desde el servidor.');
                
                const gradesData = await gradesResponse.json();
                
                if (gradesData && gradesData.length > 0) {
                    tableBody.innerHTML = ''; // Limpiar mensaje de "Cargando..."
                    let totalDefinitiva = 0;
                    let countDefinitiva = 0;

                    gradesData.forEach(grade => {
                        tableBody.innerHTML += renderRow(grade);
                        if (grade.definitiva !== null && grade.definitiva !== undefined) {
                            totalDefinitiva += parseFloat(grade.definitiva);
                            countDefinitiva++;
                        }
                    });
                    
                    // Actualizar el promedio del semestre
                    if (countDefinitiva > 0 && averageSpan) {
                        const avg = totalDefinitiva / countDefinitiva;
                        averageSpan.textContent = avg.toFixed(2);
                    }

                } else {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay calificaciones registradas para el periodo actual.</td></tr>';
                }

            } catch (error) {
                console.error('Error al cargar calificaciones:', error);
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ff0055;">${error.message}</td></tr>`;
                if (periodSubtitle) periodSubtitle.textContent = `PERIODO_ACTUAL: ERROR`;
            }
        });
    </script>
</body>
</html>
