<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Sesiones</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; }
        .ipn-logo, .system-v, .section-title, .nav-item.active, .nav-item:hover, .user-dot, .widget-header, .mono-sub, .health-value, .status-bar-fill, .btn-outline-cyan, .badge.available { color: var(--neon-green) !important; border-color: var(--neon-green) !important; }
        .nav-item.active { background: rgba(0, 255, 136, 0.1) !important; box-shadow: inset 3px 0 0 var(--neon-green) !important; }
        .user-dot { background: var(--neon-green) !important; box-shadow: 0 0 8px var(--neon-green) !important; }
        .badge.warning { border-color: #ff0055 !important; color: #ff0055 !important; background: rgba(255,0,85,0.1) !important; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info"><span class="esime-name">ESIME CU</span><span class="system-v">SAES_CLOUD_V.26</span></div>
            <button class="menu-toggle" onclick="document.querySelector('.sidebar-fixed').classList.toggle('active')">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">S. Morales</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ALUMNO REGULAR</span></div>
        </div>
        <a href="../esimecu.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_ENLACE</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Sesiones Activas</h1>
                <p class="mono-sub">DISPOSITIVOS_CONECTADOS // MONITOR_DE_ACCESO</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="widget-header">DISPOSITIVO ACTUAL</div>
            <ul class="action-list">
                <li style="border:none;">
                    <div>
                        <span style="display:block; font-weight:bold; color:var(--neon-green);">Windows 10 - Chrome</span>
                        <span style="font-size:0.7rem; opacity:0.6;">CDMX, México • IP: 192.168.1.55</span>
                    </div>
                    <span class="badge available">EN LÍNEA</span>
                </li>
            </ul>
        </div>

        <div class="glass-widget wide-widget" style="margin-top: 20px;">
            <div class="widget-header">OTRAS SESIONES</div>
            <ul class="action-list">
                <li>
                    <div>
                        <span style="display:block; font-weight:bold;">iPhone 13 - Safari</span>
                        <span style="font-size:0.7rem; opacity:0.6;">Hace 2 horas • IP: 189.20.10.4</span>
                    </div>
                    <button class="btn-outline-cyan" style="width:auto; margin:0; padding:5px 10px; font-size:0.6rem; border-color:#ff0055; color:#ff0055;">CERRAR SESIÓN</button>
                </li>
            </ul>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn-outline-cyan" style="width: auto; border-color:#ff0055; color:#ff0055;">CERRAR TODAS LAS SESIONES</button>
            </div>
        </div>
    </main>
    <script src="../js/api-config.js"></script>
    <script src="../js/catalog-service.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.career-select').forEach(s => populateCareers(s));
        });
    </script>
</body>
</html>
