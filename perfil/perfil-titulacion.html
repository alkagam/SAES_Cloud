<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Jurados Titulación</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --perfil-primary: #bf00ff; }
        .exam-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(191, 0, 255, 0.2);
            padding: 20px; border-radius: 10px; margin-bottom: 20px;
        }
        .exam-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .jurado-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .role-label { font-size: 0.7rem; color: var(--perfil-primary); font-weight: bold; display: block; margin-bottom: 5px; }
        .select-jurado { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">PER<span style="color: #bf00ff;">.ACAD</span></span>
            <div class="school-info"><span class="esime-name">LOGÍSTICA</span><span class="system-v" style="color:#bf00ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">COORD. ACAD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">PERFIL ACADÉMICO</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Jurados de Titulación</h1>
                <p class="mono-sub" style="color: #bf00ff !important;">EXÁMENES_PROFESIONALES // ASIGNACIÓN</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <!-- Examen 1 -->
            <div class="exam-card">
                <div class="exam-header">
                    <div>
                        <h3 style="margin:0;">ALUMNO: MORALES S. SAUL</h3>
                        <span style="font-size:0.75rem; opacity:0.7;">OPCIÓN: TESIS INDIVIDUAL</span>
                    </div>
                    <div style="text-align:right;">
                        <span style="display:block; font-weight:bold; color:var(--perfil-primary);">28 AGO 2024</span>
                        <span style="font-size:0.75rem;">12:00 HRS - SALA DE JUNTAS</span>
                    </div>
                </div>
                <div class="jurado-grid">
                    <div>
                        <label class="role-label">PRESIDENTE</label>
                        <select class="select-jurado"><option>DR. ALAN TURING</option></select>
                    </div>
                    <div>
                        <label class="role-label">SECRETARIO</label>
                        <select class="select-jurado"><option>ING. GRACE HOPPER</option></select>
                    </div>
                    <div>
                        <label class="role-label">VOCAL</label>
                        <select class="select-jurado"><option>M. EN C. ADA LOVELACE</option></select>
                    </div>
                    <div>
                        <label class="role-label">SUPLENTE</label>
                        <select class="select-jurado"><option>ING. NIKOLA TESLA</option></select>
                    </div>
                </div>
                <div style="margin-top: 15px; text-align: right;">
                    <button style="background: var(--perfil-primary); color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer;">CONFIRMAR JURADO</button>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/perfil-sidebar-loader.js"></script>
</body>
</html>
