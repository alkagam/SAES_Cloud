<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Reportes</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --perfil-primary: #bf00ff; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; text-align: center; }
        .stat-num { font-size: 2rem; font-weight: bold; color: var(--perfil-primary); }
        .stat-label { font-size: 0.7rem; color: rgba(255,255,255,0.6); }
        .chart-placeholder { height: 200px; border: 1px dashed rgba(191,0,255,0.3); display: flex; align-items: center; justify-content: center; margin-top: 20px; color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">PER<span style="color: #bf00ff;">.ACAD</span></span>
            <div class="school-info"><span class="esime-name">LOGÍSTICA</span><span class="system-v" style="color:#bf00ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">COORD. ACAD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">PERFIL ACADÉMICO</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Reportes por Academia</h1>
                <p class="mono-sub" style="color: #bf00ff !important;">ESTADÍSTICAS // RENDIMIENTO</p>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="stat-box">
                <div class="stat-num">85%</div>
                <div class="stat-label">COBERTURA DOCENTE</div>
            </div>
            <div class="stat-box">
                <div class="stat-num">12</div>
                <div class="stat-label">GRUPOS SIN PROFESOR</div>
            </div>
        </div>

        <div class="glass-widget wide-widget" style="margin-top: 20px;">
            <div class="widget-head" style="color: var(--perfil-primary);">DISTRIBUCIÓN DE HORAS</div>
            <div class="chart-placeholder">
                [GRÁFICA: HORAS BASE VS INTERINATO]
            </div>
        </div>
    </main>
    <script src="../js/perfil-sidebar-loader.js"></script>
</body>
</html>
