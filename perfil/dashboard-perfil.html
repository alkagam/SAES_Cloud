<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Académico</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --perfil-primary: #bf00ff; }
        .widget-head { color: var(--perfil-primary) !important; border-bottom-color: rgba(191, 0, 255, 0.2) !important; }
        .st-value { text-shadow: 0 0 20px rgba(191, 0, 255, 0.3); }
        .btn-outline-purple {
            width: 100%; background: transparent; border: 1px solid var(--perfil-primary);
            color: var(--perfil-primary); padding: 10px; border-radius: 6px; cursor: pointer;
            transition: 0.3s; font-size: 0.7rem; font-weight: bold; margin-top: 15px;
        }
        .btn-outline-purple:hover { background: var(--perfil-primary); color: white; box-shadow: 0 0 20px var(--perfil-primary); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">PER<span style="color: #bf00ff;">.ACAD</span></span>
            <div class="school-info"><span class="esime-name">LOGÍSTICA</span><span class="system-v" style="color:#bf00ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">COORD. ACAD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">PERFIL ACADÉMICO</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Perfil Académico</h1>
                <p class="mono-sub" style="color: #bf00ff !important;">COORDINACIÓN // ASIGNACIÓN_DOCENTE</p>
            </div>
            <div class="system-health" style="font-family: 'JetBrains Mono'; font-size: 0.7rem;">
                <span class="health-label" style="opacity:0.6;">ESTADO:</span>
                <span class="health-value" style="color: #bf00ff;">ONLINE</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="glass-widget">
                <div class="widget-head">MATERIAS SIN PROFESOR</div>
                <span class="st-value" style="color: #ffcc00;">12</span>
            </div>
            <div class="glass-widget">
                <div class="widget-head">JURADOS ASIGNADOS</div>
                <span class="st-value">45</span>
            </div>
            <div class="glass-widget wide-widget">
                <div class="widget-head">ACCIONES RÁPIDAS</div>
                <button class="btn-outline-purple">GENERAR REPORTE DE CARGA</button>
            </div>
        </div>
    </main>
    <script src="../js/perfil-sidebar-loader.js"></script>
</body>
</html>
