<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Aulas</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --perfil-primary: #bf00ff; }
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .room-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 8px; text-align: center;
        }
        .room-card h3 { color: var(--perfil-primary); margin: 0 0 5px 0; }
        .capacity { font-size: 0.7rem; color: rgba(255,255,255,0.6); }
        .badge-room { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; border: 1px solid; display: inline-block; margin-top: 5px; }
        .free { color: #00ff88; border-color: #00ff88; }
        .busy { color: #ff0055; border-color: #ff0055; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">PER<span style="color: #bf00ff;">.ACAD</span></span>
            <div class="school-info"><span class="esime-name">LOGÍSTICA</span><span class="system-v" style="color:#bf00ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">COORD. ACAD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">PERFIL ACADÉMICO</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Disponibilidad de Aulas</h1>
                <p class="mono-sub" style="color: #bf00ff !important;">INFRAESTRUCTURA // CAPACIDAD</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="room-grid">
                <div class="room-card">
                    <h3>1101</h3>
                    <div class="capacity">Cap: 40</div>
                    <span class="badge-room busy">OCUPADO</span>
                </div>
                <div class="room-card">
                    <h3>1102</h3>
                    <div class="capacity">Cap: 40</div>
                    <span class="badge-room free">DISPONIBLE</span>
                </div>
            </div>
        </div>
    </main>
    <script src="../js/perfil-sidebar-loader.js"></script>
</body>
</html>
