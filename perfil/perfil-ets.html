<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Asignación ETS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --perfil-primary: #bf00ff; }
        .cyber-table th { color: var(--perfil-primary); border-bottom-color: rgba(191, 0, 255, 0.3); }
        .input-control { 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 8px; border-radius: 4px; width: 100%; font-size: 0.8rem;
        }
        .input-control:focus { border-color: var(--perfil-primary); outline: none; }
        .btn-action {
            background: var(--perfil-primary); color: white; border: none; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-weight: bold;
        }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">PER<span style="color: #bf00ff;">.ACAD</span></span>
            <div class="school-info"><span class="esime-name">LOGÍSTICA</span><span class="system-v" style="color:#bf00ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">COORD. ACAD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">PERFIL ACADÉMICO</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Exámenes a Título (ETS)</h1>
                <p class="mono-sub" style="color: #bf00ff !important;">PROGRAMACIÓN_DE_FECHAS // SINODALES</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="table-responsive">
                <table class="cyber-table">
                    <thead>
                        <tr>
                            <th>MATERIA</th>
                            <th>FECHA Y HORA</th>
                            <th>SALÓN</th>
                            <th>SINODAL TITULAR</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>CÁLCULO VECTORIAL</td>
                            <td><input type="datetime-local" class="input-control" value="2024-08-25T10:00"></td>
                            <td><input type="text" class="input-control" value="A-101" style="width: 80px;"></td>
                            <td>
                                <select class="input-control">
                                    <option>ING. JUAN PÉREZ</option>
                                    <option>DRA. ANA MARTÍNEZ</option>
                                </select>
                            </td>
                            <td><button class="btn-action">GUARDAR</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="../js/perfil-sidebar-loader.js"></script>
</body>
</html>
