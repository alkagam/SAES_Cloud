<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT | TERMINAL</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --root-green: #00ff00; }
        .terminal-window {
            background: rgba(0, 10, 0, 0.9); border: 1px solid var(--root-green);
            border-radius: 8px; padding: 20px; height: 70vh; overflow-y: auto;
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--root-green);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        .command-line { display: flex; align-items: center; margin-top: 10px; }
        .prompt { color: #00ff00; margin-right: 10px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; color: white; flex: 1;
            font-family: 'JetBrains Mono'; font-size: 0.8rem; outline: none;
        }
        .output-line { margin-bottom: 5px; opacity: 0.9; }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">ROOT<span style="color: white;">.SYS</span></span>
            <div class="school-info"><span class="esime-name">INFRAESTRUCTURA</span><span class="system-v">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">ROOT</span><span style="font-size:0.6rem; color:rgba(0,255,0,0.7);">SYSTEM ADMIN</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">LOGOUT_</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Terminal Console</h1>
                <p class="mono-sub" style="color: var(--root-green) !important;">SSH_SESSION // ENCRYPTED</p>
            </div>
        </header>

        <div class="terminal-window" id="terminal">
            <div class="output-line">IPN Core System v2.0.4-stable</div>
            <div class="output-line">Last login: Today at 08:42:11 from 192.168.1.5</div>
            <div class="output-line">Type 'help' for available commands.</div>
            <br>
            <div class="command-line">
                <span class="prompt">root@ipn-core:~#</span>
                <input type="text" class="cmd-input" autofocus>
            </div>
        </div>
    </main>
    <script src="../js/root-sidebar-loader.js"></script>
    <script>
        const input = document.querySelector('.cmd-input');
        const terminal = document.getElementById('terminal');

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const cmd = this.value;
                const newLine = document.createElement('div');
                newLine.className = 'output-line';
                newLine.innerHTML = `<span style="color:#00ff00">root@ipn-core:~#</span> ${cmd}<br><span style="opacity:0.7; color:#ccc;">> Command executed: ${cmd} (simulated)</span>`;
                terminal.insertBefore(newLine, document.querySelector('.command-line'));
                this.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });
    </script>
</body>
</html>
