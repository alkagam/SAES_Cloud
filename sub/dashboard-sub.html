<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Académicos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --sub-orange: #ffaa00; }
        .widget-head { color: var(--sub-orange) !important; border-bottom-color: rgba(255, 170, 0, 0.2) !important; }
        .st-value { text-shadow: 0 0 20px rgba(255, 170, 0, 0.3); }
        .btn-outline-orange {
            width: 100%; background: transparent; border: 1px solid var(--sub-orange);
            color: var(--sub-orange); padding: 10px; border-radius: 6px; cursor: pointer;
            transition: 0.3s; font-size: 0.7rem; font-weight: bold; margin-top: 15px;
        }
        .btn-outline-orange:hover { background: var(--sub-orange); color: black; box-shadow: 0 0 20px var(--sub-orange); }
    </style>
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">SUB<span style="color: #ffaa00;">.SEIS</span></span>
            <div class="school-info"><span class="esime-name">BIENESTAR</span><span class="system-v" style="color:#ffaa00;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">DR. SALUD</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">SUBDIRECCIÓN</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Subdirección de Servicios</h1>
                <p class="mono-sub" style="color: #ffaa00 !important;">EDUCATIVOS_E_INTEGRACIÓN_SOCIAL</p>
            </div>
            <div class="system-health" style="font-family: 'JetBrains Mono'; font-size: 0.7rem;">
                <span class="health-label" style="opacity:0.6;">ESTADO:</span>
                <span class="health-value" style="color: #ffaa00;">ONLINE</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="glass-widget">
                <div class="widget-head">DICTÁMENES MÉDICOS</div>
                <span class="st-value">8</span>
            </div>
            <div class="glass-widget">
                <div class="widget-head">BECAS ACTIVAS</div>
                <span class="st-value">1,250</span>
            </div>
            <div class="glass-widget wide-widget">
                <div class="widget-head">ACCIONES RÁPIDAS</div>
                <button class="btn-outline-orange">VALIDAR CERTIFICADOS MÉDICOS</button>
            </div>
        </div>
    </main>
    <script src="../js/sub-sidebar-loader.js"></script>
</body>
</html>
