<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Cloud | Perfil Docente</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/tema-verde.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">IPN</span>
            <div class="school-info"><span class="esime-name">ESIME CU</span><span class="system-v">DOCENTE_SUITE_V.2</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot"></span>
            <div><span style="font-weight:bold; color:white;">ING. PÉREZ</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">ACADEMIA COMPUTACIÓN</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Perfil del Docente</h1>
                <p class="mono-sub" style="color: var(--doc-primary) !important;">DATOS_PERSONALES // ADMINISTRATIVO</p>
            </div>
        </header>

        <div class="glass-widget wide-widget">
            <div class="profile-header">
                <div class="profile-pic">JP</div>
                <div>
                    <h2 style="margin: 0; font-size: 1.5rem;">JUAN PÉREZ LÓPEZ</h2>
                    <span style="color: var(--doc-primary); font-family: 'JetBrains Mono'; font-size: 0.8rem;">ID: DOC-998877</span>
                </div>
            </div>

            <div class="dashboard-grid">
                <div>
                    <div class="form-group">
                        <label>RFC</label>
                        <input type="text" class="form-control" value="PELJ800101XXX" readonly>
                    </div>
                    <div class="form-group">
                        <label>ACADEMIA</label>
                        <input type="text" class="form-control" value="INGENIERÍA EN COMPUTACIÓN" readonly>
                    </div>
                    <div class="form-group">
                        <label>CATEGORÍA</label>
                        <input type="text" class="form-control" value="TITULAR C" readonly>
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>CORREO INSTITUCIONAL</label>
                        <input type="email" class="form-control" value="jperez@ipn.mx">
                    </div>
                    <div class="form-group">
                        <label>TELÉFONO DE CONTACTO</label>
                        <input type="tel" class="form-control" value="55 1234 5678">
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn-doc" style="width: auto; padding: 10px 30px;">ACTUALIZAR DATOS</button>
            </div>
        </div>

        <div class="glass-widget wide-widget" style="margin-top: 20px;">
            <div class="widget-header">EVALUACIÓN DOCENTE (PROMEDIO HISTÓRICO)</div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 30px; align-items: center;">
                <div style="text-align: center;">
                    <div style="font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 10px;">PROMEDIO GENERAL</div>
                    <div style="font-size: 4rem; font-weight: bold; color: var(--doc-primary); line-height: 1; text-shadow: 0 0 20px var(--doc-primary);">4.8</div>
                    <div style="font-size: 0.7rem; color: rgba(255,255,255,0.6);">sobre 5.0</div>
                </div>
                <div>
                    <div class="chart-placeholder">[ GRÁFICA DE LÍNEA: EVALUACIÓN POR PERIODO 23/1 a 25/1 ]</div>
                </div>
            </div>
        </div>

    </main>
    <script src="../js/docente-sidebar-loader.js"></script>
</body>
</html>
