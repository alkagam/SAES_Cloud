<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Escolar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dashboard-layout">
    <div class="background-blur"></div>
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <span class="ipn-logo">GES<span style="color: #00d4ff;">.ESC</span></span>
            <div class="school-info"><span class="esime-name">OPERACIONES</span><span class="system-v" style="color:#00d4ff;">V.2.0</span></div>
            <button class="menu-toggle">☰</button>
        </div>
        <nav class="nav-container"></nav>
        <div class="user-mini-card">
            <span class="user-dot" style="background: #00d4ff; box-shadow: 0 0 10px #00d4ff;"></span>
            <div><span style="font-weight:bold; color:white;">OPERADOR 1</span><span style="font-size:0.6rem; color:rgba(255,255,255,0.5);">GESTIÓN ESCOLAR</span></div>
        </div>
        <a href="../index.html" class="btn-exit" style="color: #fff; opacity: 0.7;">CERRAR_SESIÓN</a>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <div class="header-main">
                <h1>Gestión Escolar</h1>
                <p class="mono-sub" style="color: #00d4ff !important;">CICLO_OPERATIVO // EN_CURSO</p>
            </div>
            <div class="system-health" style="font-family: 'JetBrains Mono'; font-size: 0.7rem;">
                <span class="health-label" style="opacity:0.6;">ESTADO:</span>
                <span class="health-value" style="color: #00d4ff;">ONLINE</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="glass-widget">
                <div class="widget-head">INSCRITOS HOY</div>
                <span class="st-value">850</span>
            </div>
            <div class="glass-widget">
                <div class="widget-head">OCUPACIÓN SALONES</div>
                <span class="st-value">92%</span>
            </div>
            <div class="glass-widget wide-widget">
                <div class="widget-head">ALERTAS OPERATIVAS</div>
                <ul class="action-list">
                    <li><span>Conflicto de Horario: Lab 4</span> <span class="badge warning">REVISAR</span></li>
                    <li><span>Falta de Cupo: 1CV5</span> <span class="badge locked">CRÍTICO</span></li>
                </ul>
            </div>
        </div>
    </main>
    <script src="../js/gestion-sidebar-loader.js"></script>
</body>
</html>
